# ==========================================
# Application
# ==========================================
spring.application.name=cimelect-backend

# ==========================================
# PostgreSQL Database
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/cimelect_db
spring.datasource.username=postgres
spring.datasource.password=123456789

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Server
# ==========================================
server.port=8080

# ==========================================
# Uploads
# ==========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=uploads

# ==========================================
# JWT
# ==========================================
app.jwt.secret=CimelectJwtSecretKeyChangeMeInProduction_2026_Min32Chars!!
app.jwt.expiration-ms=86400000

# ==========================================
# Business rules
# ==========================================
app.shipment.delay-threshold-days=3
app.bootstrap.admin.email=admin@cimelect.local
app.bootstrap.admin.password=Admin123!
